# ─────────────────────────────────────────────
#  X-Ray Baggage Screening — YOLO object-detection configuration
# ─────────────────────────────────────────────

# Dataset
dataset:
  yaml: "data/data.yaml"
  root: "data"
  image_size: 640
  num_classes: 12

# Model
model:
  weights: "yolov8n.pt"

# Training
training:
  epochs: 50
  batch_size: 16
  workers: 2
  device: "cuda"                   # uses CPU automatically when CUDA is unavailable
  patience: 10
  project: "outputs/checkpoints"
  name: "detector"

# Detection visualization
inference:
  conf: 0.25
  iou: 0.7
  max_det: 100
  num_visualize: 16

# Outputs
outputs:
  viz_dir: "outputs/visualizations"
  best_model: "runs/detect/outputs/checkpoints/detector/weights/best.pt"
